name: PHP Tests

on:
  push:
    branches: [ main, develop, 'release/**' ]
  pull_request:
    branches: [ main, develop, 'release/**' ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: 6,  testbench: '^4.0',  php: '7.4' }
          - { laravel: 7,  testbench: '^5.0',  php: '7.4' }
          - { laravel: 8,  testbench: '^6.0',  php: '7.4' }
          - { laravel: 8,  testbench: '^6.0',  php: '8.0' }
          - { laravel: 8,  testbench: '^6.0',  php: '8.1' }
          - { laravel: 9,  testbench: '^7.0',  php: '8.0' }
          - { laravel: 9,  testbench: '^7.0',  php: '8.1' }
          - { laravel: 9,  testbench: '^7.0',  php: '8.2' }
          - { laravel: 10, testbench: '^8.0',  php: '8.1' }
          - { laravel: 10, testbench: '^8.0',  php: '8.2' }
          - { laravel: 10, testbench: '^8.0',  php: '8.3' }
          - { laravel: 11, testbench: '^9.0',  php: '8.2' }
          - { laravel: 11, testbench: '^9.0',  php: '8.3' }
          - { laravel: 11, testbench: '^9.0',  php: '8.4' }
          - { laravel: 12, testbench: '^10.0', php: '8.2' }
          - { laravel: 12, testbench: '^10.0', php: '8.3' }
          - { laravel: 12, testbench: '^10.0', php: '8.4' }
          - { laravel: 12, testbench: '^10.0', php: '8.5' }
          - { laravel: 13, testbench: '^11.0', php: '8.3' }
          - { laravel: 13, testbench: '^11.0', php: '8.4' }
          - { laravel: 13, testbench: '^11.0', php: '8.5' }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, xml, curl, json, dom, filter, hash, pdo, pdo_sqlite
        coverage: none
        tools: composer:v2

    - name: Pin Laravel ${{ matrix.laravel }}
      run: |
        # Older Laravel releases have published advisories; Composer would refuse to
        # install them. The security job below audits the current versions instead.
        # (setting exists from Composer 2.9; older versions don't block, so ignore failure)
        composer config audit.block-insecure false || true
        composer require "illuminate/support:^${{ matrix.laravel }}.0" --no-update --no-interaction
        composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies

    - name: Show resolved versions
      run: composer show laravel/framework phpunit/phpunit orchestra/testbench | grep -E '^(name|versions)'

    - name: Run tests (unit, Laravel boot, mapping snapshots)
      run: vendor/bin/phpunit

  coverage:
    runs-on: ubuntu-latest
    name: Coverage

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, curl, json
        coverage: pcov

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Generate coverage report
      run: composer test-coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage/coverage.xml
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    name: Security Audit

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, curl, json

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Run security audit
      run: composer audit
