name: Safe Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Full PHP x Laravel matrix, including mapping snapshot tests
  test:
    uses: ./.github/workflows/php.yml

  architecture:
    runs-on: ubuntu-latest
    name: Release Checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, curl, json

    - name: Tag must match composer.json version
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        VERSION=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["version"] ?? "";')
        if [ "$TAG" != "$VERSION" ]; then
          echo "❌ Tag $GITHUB_REF_NAME does not match composer.json version $VERSION"
          exit 1
        fi
        echo "✅ Tag matches composer.json version $VERSION"

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Run Architecture Tests
      run: |
        php -r "
        require 'vendor/autoload.php';
        use Ekatra\Product\EkatraSDK;
        
        echo '=== RELEASE ARCHITECTURE VALIDATION ===' . PHP_EOL;
        
        \$testData = [
            'product_id' => '20051',
            'title' => 'Test Product',
            'currency' => 'INR',
            'variant_quantity' => 5,
            'variant_mrp' => 1000,
            'variant_selling_price' => 800
        ];
        
        // Get expected version from composer.json
        \$composerPath = __DIR__ . '/composer.json';
        \$expectedVersion = 'unknown';
        if (file_exists(\$composerPath)) {
            \$composer = json_decode(file_get_contents(\$composerPath), true);
            \$expectedVersion = \$composer['version'] ?? 'unknown';
        }
        
        \$methods = [
            'transformProduct' => function(\$data) { return EkatraSDK::transformProduct(\$data); },
            'transformVariant' => function(\$data) { return EkatraSDK::transformVariant(\$data); },
            'smartTransformProduct' => function(\$data) { return EkatraSDK::smartTransformProduct(\$data); },
            'smartTransformProductFlexible' => function(\$data) { return EkatraSDK::smartTransformProductFlexible(\$data); }
        ];
        
        \$allPassed = true;
        foreach (\$methods as \$methodName => \$method) {
            try {
                \$result = \$method(\$testData);
                \$checks = [
                    'Has status' => isset(\$result['status']),
                    'Has metadata' => isset(\$result['metadata']),
                    'Has message' => isset(\$result['message']),
                    'Has SDK version' => isset(\$result['metadata']['sdkVersion']),
                    'SDK version matches composer.json' => \$result['metadata']['sdkVersion'] === \$expectedVersion
                ];
                
                \$passed = !in_array(false, \$checks);
                if (!\$passed) {
                    \$allPassed = false;
                    echo '❌ ' . \$methodName . ' FAILED' . PHP_EOL;
                } else {
                    echo '✅ ' . \$methodName . ' PASSED' . PHP_EOL;
                }
            } catch (\Exception \$e) {
                \$allPassed = false;
                echo '❌ ' . \$methodName . ' EXCEPTION: ' . \$e->getMessage() . PHP_EOL;
            }
        }
        
        if (\$allPassed) {
            echo PHP_EOL . '🎉 RELEASE ARCHITECTURE VALIDATION PASSED!' . PHP_EOL;
            exit(0);
        } else {
            echo PHP_EOL . '❌ RELEASE ARCHITECTURE VALIDATION FAILED!' . PHP_EOL;
            exit(1);
        }
        "

  create-draft-release:
    runs-on: ubuntu-latest
    name: Create Draft Release
    needs: [test, architecture]

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Draft Release
      run: |
        # Tags with a suffix (v2.2.0-RC1, v2.2.0-beta.1) are pre-releases for staging.
        # Composer will not install them unless a project asks for that exact version.
        PRERELEASE_FLAG=""
        case "${{ github.ref_name }}" in
          *-*) PRERELEASE_FLAG="--prerelease" ;;
        esac

        gh release create ${{ github.ref_name }} \
          --title "Release ${{ github.ref_name }}" \
          --draft \
          $PRERELEASE_FLAG \
          --notes "## Release ${{ github.ref_name }}

          This release has passed all tests across PHP 7.4-8.5 and Laravel 6-13, including mapping snapshot tests and architecture validation.
          
          ### Features:
          - ✅ Single ResponseBuilder architecture (v${{ github.ref_name }})
          - ✅ Consistent response structure across all methods
          - ✅ Robust error handling for all edge cases
          - ✅ Comprehensive test matrix
          - ✅ Architecture validation tests
          - ✅ Performance and security tests
          - ✅ Enhanced discount handling with discountLabel field
          - ✅ Support for both numeric and string discount formats
          - ✅ Product sync methods for bulk operations (syncProductData, syncProductsBatch)
          - ✅ Flexible field name mapping for sync operations
          - ✅ Batch processing with error isolation
          
          ### Discount Handling:
          The SDK now supports enhanced discount handling with both numeric and string formats:
          - **Numeric discount**: Provided as number (e.g., 20.5) → stored in \`discount\` field
          - **String discount**: Provided as text (e.g., \"20% OFF on DIA\") → auto-calculates percentage in \`discount\` field, stores text in \`discountLabel\` field
          - **Both provided**: Uses numeric for \`discount\`, string for \`discountLabel\`
          - **Neither provided**: Auto-calculates percentage from MRP vs selling price
          
          ### Product Sync Methods (NEW):
          - **syncProductData()**: Transform single product, returns data only (throws exception on failure)
          - **syncProductsBatch()**: Transform multiple products, returns successful + failed separately
          - **syncProduct()**: Transform single product with full ResponseBuilder format
          - Supports flexible field names (productId/product_id, title/name, etc.)
          - Handles nested structures automatically
          - Perfect for bulk product syncing to Ekatra APIs
          
          ### Response Structure:
          \`\`\`json
          {
              \"status\": \"success|error\",
              \"data\": {
                  \"variants\": [{
                      \"variations\": [{
                          \"discount\": 20.0,
                          \"discountLabel\": \"20% OFF on DIA\"
                      }]
                  }]
              },
              \"metadata\": {
                  \"validation\": {...},
                  \"dataType\": \"...\",
                  \"canAutoTransform\": true/false,
                  \"manualSetupRequired\": true/false,
                  \"maxQuantity\": number|null,
                  \"sdkVersion\": \"${{ github.ref_name }}\"
              },
              \"message\": \"Product details retrieved successfully\"
          }
          \`\`\`
          
          ### Installation:
          \`\`\`bash
          composer require ekatra/product-sdk:^${{ github.ref_name }}
          \`\`\`"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    runs-on: ubuntu-latest
    name: Publish Release
    needs: create-draft-release
    # Stable releases wait for approval on the "production" environment.
    # Pre-releases (tags containing "-") publish straight away for staging.
    environment: ${{ contains(github.ref_name, '-') && 'pre-release' || 'production' }}

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Publish Release
      run: |
        gh release edit ${{ github.ref_name }} --draft=false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  packagist:
    runs-on: ubuntu-latest
    name: Update Packagist
    needs: publish-release
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Update Packagist
      env:
        PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
        PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
      run: |
        echo "Updating Packagist..."

        if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
          echo "❌ PACKAGIST_USERNAME or PACKAGIST_TOKEN secrets are not set!"
          echo "Please add these secrets in GitHub repository settings."
          exit 1
        fi

        # Credentials go in a header, never in the URL or the log
        curl --fail --silent --show-error -X POST "https://packagist.org/api/update-package" \
          -H "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{"repository":{"url":"https://github.com/Ekatra-Global-Corp/ekatra-php-sdk"}}'

        echo "✅ Packagist update request sent successfully!"
